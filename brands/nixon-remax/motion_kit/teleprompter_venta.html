<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teleprompter Santa Isabel</title>
<style>
  :root { --bg:#0e1511; --fg:#f4f1e8; --dim:#6f7a72; --acc:#ecd628; --card:#17201a; --line:#2a352d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: Georgia, "Times New Roman", serif; min-height:100vh; }
  header { padding:14px 16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:5; }
  select, button { font: 600 16px system-ui, sans-serif; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:#0f1712; color:var(--fg); }
  button.go { background:var(--acc); color:#16200f; border-color:var(--acc); }
  #time { font: 700 20px ui-monospace, Consolas, monospace; margin-left:auto; color:var(--acc); }
  #bar { height:6px; background:var(--line); } #bar i { display:block; height:100%; width:0; background:var(--acc); }
  main { padding:24px 18px 120px; max-width:900px; margin:0 auto; text-align:center; }
  #count { font: 800 120px system-ui, sans-serif; color:var(--acc); min-height:140px; }
  .prev, .next { color:var(--dim); font-size:22px; margin:10px 0; line-height:1.3; min-height:30px; }
  .cur { font-size:clamp(34px, 7vw, 64px); line-height:1.2; margin:22px 0; font-weight:700; min-height:160px; }
  .hint { color:var(--dim); font: 14px system-ui, sans-serif; margin-top:30px; }
  details { margin-top:34px; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  summary { cursor:pointer; font: 600 16px system-ui, sans-serif; }
  ol { padding-left:20px; } li { margin:10px 0; line-height:1.35; font-size:19px; } li b { color:var(--acc); font: 700 14px ui-monospace, Consolas, monospace; margin-right:8px; }
</style>
</head>
<body>
<header>
  <select id="sel"></select>
  <button class="go" id="start">Iniciar (3 s)</button>
  <button id="stop">Parar</button>
  <div id="time">0.0 / 30.0 s</div>
</header>
<div id="bar"><i id="fill"></i></div>
<main>
  <div id="count"></div>
  <div class="prev" id="prev"></div>
  <div class="cur" id="cur">Elija el video y pulse «Iniciar».</div>
  <div class="next" id="next"></div>
  <div class="hint">Empiece a grabar el audio ANTES de pulsar «Iniciar». Hable con calma: cada frase aparece justo cuando debe empezar. Si se equivoca, pulse «Parar» y repita la toma completa.</div>
  <details open><summary>Guion completo de este video</summary><ol id="all"></ol></details>
</main>
<script>
const CIERRE = "Escríbanos para agendar su visita.";
const CUERPO_A = [
  [4.2,  "Lotificación Santa Isabel, en Comacarán, San Miguel."],
  [7.6,  "Frente al Instituto Nacional de Comacarán y cerca del parque central."],
  [11.2, "Terrenos desde doscientas ochenta y seis varas cuadradas, con escritura y agua conectada."],
  [14.8, "Calles asfaltadas dentro de la lotificación."],
  [19.2, "Desde veinticuatro mil quinientos dólares, con financiamiento con Banco Industrial."],
  [25.4, CIERRE]
];
const CUERPO_G = [
  [4.2,  "Lotificación Santa Isabel, en Comacarán, San Miguel."],
  [7.6,  "Frente al Instituto Nacional de Comacarán y cerca del parque central."],
  [11.2, "Terrenos desde doscientas ochenta y seis varas cuadradas, con escritura y agua conectada, listos para construir."],
  [15.2, "Con calles asfaltadas dentro de la lotificación."],
  [19.2, "Desde veinticuatro mil quinientos dólares, con financiamiento con Banco Industrial."],
  [25.4, CIERRE]
];
const VIDEOS = {
  "A · ¿Busca dónde construir su nueva casa?": [[0.2, "¿Busca dónde construir su nueva casa en San Miguel?"], ...CUERPO_A],
  "B · Paz y tranquilidad": [[0.2, "Paz y tranquilidad, a minutos de la ciudad."], ...CUERPO_A],
  "G1 · ¿Cuánto cuesta un terreno en Comacarán?": [[0.2, "¿Cuánto cuesta un terreno en Comacarán? Desde veinticuatro mil quinientos dólares."], ...CUERPO_G],
  "G2 · Tres preguntas": [
    [0.2,  "Tres preguntas antes de comprar un terreno."],
    [4.2,  "Uno. ¿Dónde queda? Frente al Instituto Nacional de Comacarán, cerca del parque central."],
    [9.3,  "Lotificación Santa Isabel, en Comacarán, San Miguel."],
    [11.2, "Dos. ¿Qué trae? Escritura, agua conectada y calles asfaltadas."],
    [15.8, "Terrenos listos para construir."],
    [19.2, "Tres. ¿Cuánto cuesta? Desde veinticuatro mil quinientos dólares, en terrenos desde doscientas ochenta y seis varas cuadradas."],
    [24.0, "Con financiamiento con Banco Industrial."],
    [25.4, CIERRE]],
  "G4 · ¿Y al comprar me dan mi escritura?": [[0.2, "¿Y al comprar me dan mi escritura? Sí: con escritura."], ...CUERPO_G],
  "H · Hermano lejano": [[0.2, "Hermano lejano: su terreno en Comacarán, El Salvador."], ...CUERPO_G]
};
const sel = document.getElementById('sel');
Object.keys(VIDEOS).forEach(k => { const o = document.createElement('option'); o.textContent = k; sel.appendChild(o); });
const $ = id => document.getElementById(id);
let timer = null, t0 = 0;
function fmt(x){ return x.toFixed(1); }
function lista() {
  const L = VIDEOS[sel.value];
  $('all').innerHTML = L.map(([t, s]) => `<li><b>${fmt(t)} s</b>${s}</li>`).join('');
  $('cur').textContent = 'Elija el video y pulse «Iniciar».'; $('prev').textContent = ''; $('next').textContent = '';
}
sel.onchange = () => { parar(); lista(); };
function parar() { clearInterval(timer); timer = null; $('count').textContent = ''; $('fill').style.width = '0'; $('time').textContent = '0.0 / 30.0 s'; }
function correr() {
  const L = VIDEOS[sel.value];
  t0 = performance.now();
  timer = setInterval(() => {
    const t = (performance.now() - t0) / 1000;
    let i = -1; L.forEach(([ts], k) => { if (t >= ts - 0.05) i = k; });
    $('cur').textContent = i >= 0 ? L[i][1] : '…preparado…';
    $('prev').textContent = i > 0 ? L[i-1][1] : '';
    $('next').textContent = i + 1 < L.length ? 'Sigue: ' + L[i+1][1] : '';
    $('time').textContent = fmt(Math.min(t, 30)) + ' / 30.0 s';
    $('fill').style.width = Math.min(100, t / 30 * 100) + '%';
    if (t >= 30.5) { parar(); $('cur').textContent = 'Listo. Guarde la grabación como vo_' + sel.value.split(' ')[0] + '.'; }
  }, 50);
}
$('start').onclick = () => {
  parar(); let n = 3; $('count').textContent = n; $('cur').textContent = 'Prepárese…';
  const c = setInterval(() => { n--; if (n > 0) $('count').textContent = n; else { clearInterval(c); $('count').textContent = ''; correr(); } }, 1000);
};
$('stop').onclick = () => { parar(); lista(); };
lista();
</script>
</body>
</html>
